name: Publish Custom Jellyfin

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-custom-jellyfin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read latest upstream version
        id: upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull ghcr.io/jellyfin/jellyfin:latest
          version=$(docker image inspect ghcr.io/jellyfin/jellyfin:latest --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          digest=$(docker image inspect ghcr.io/jellyfin/jellyfin:latest --format '{{index .RepoDigests 0}}')
          test -n "$version"
          test -n "$digest"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already published
        id: existing
        shell: bash
        run: |
          if docker manifest inspect "ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: steps.existing.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.publish == 'true'

      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.publish == 'true'
        with:
          context: .
          push: true
          build-args: |
            JELLYFIN_IMAGE=${{ steps.upstream.outputs.digest }}
            JELLYFIN_BASE_DIGEST=${{ steps.upstream.outputs.digest }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Report result
        shell: bash
        run: |
          if [[ '${{ steps.existing.outputs.publish }}' == 'true' ]]; then
            echo "Published Jellyfin ${{ steps.upstream.outputs.version }}."
          else
            echo "Jellyfin ${{ steps.upstream.outputs.version }} was already published."
          fi
