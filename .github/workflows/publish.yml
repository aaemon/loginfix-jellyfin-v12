name: Publish Custom Jellyfin

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-custom-jellyfin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Read latest upstream version
        id: upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull ghcr.io/jellyfin/jellyfin:latest
          version=$(docker image inspect ghcr.io/jellyfin/jellyfin:latest --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' ghcr.io/jellyfin/jellyfin:latest)
          test -n "$version"
          test -n "$digest"
          digest="ghcr.io/jellyfin/jellyfin@$digest"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether both architectures are published
        id: existing
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}"
          manifest=$(docker buildx imagetools inspect --raw "$image" 2>/dev/null || true)
          if [[ -n "$manifest" ]] && jq -e '
            [ .manifests[]? | .platform? // empty
              | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
              | .architecture
            ] | index("amd64") != null and index("arm64") != null
          ' <<<"$manifest" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.publish == 'true'
        with:
          platforms: arm64

      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.publish == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            JELLYFIN_IMAGE=${{ steps.upstream.outputs.digest }}
            JELLYFIN_BASE_DIGEST=${{ steps.upstream.outputs.digest }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Report result
        shell: bash
        run: |
          if [[ '${{ steps.existing.outputs.publish }}' == 'true' ]]; then
            echo "Published Jellyfin ${{ steps.upstream.outputs.version }}."
          else
            echo "Jellyfin ${{ steps.upstream.outputs.version }} was already published."
          fi
